# Builds the Astro site for GitHub Pages.
#
# This repo is a `<user>.github.io` repo, so GitHub Pages defaults to
# "Deploy from a branch", which runs Jekyll over the repository root. Jekyll
# treats a leading `---` as YAML front matter, and every .astro component opens
# with `---`, so it fails immediately trying to parse Base.astro as YAML.
#
# The fix is to stop letting Jekyll near it: switch
#   Settings -> Pages -> Source
# from "Deploy from a branch" to "GitHub Actions", and this workflow takes over.
#
# Cloudflare Pages is entirely separate and unaffected either way — it runs
# `npm run build` straight from the repo and never touches this file.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. `cancel-in-progress: false` so an in-flight
# deploy finishes rather than leaving Pages half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Installs dependencies, runs `astro build`, and uploads dist/ as the
      # Pages artifact. Requires the committed package-lock.json.
      - name: Build with Astro
        uses: withastro/action@v3
        with:
          node-version: 20

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
